# Local samples only. This package isn't published: install it from this
# directory with `pip install -e .`, never by name from PyPI.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "workflows-samples"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "google-api-core==2.44.0",
    "google-cloud-workflows==1.24.0",
    "protobuf==7.36.2",
]
# PyPI rejects uploads with this classifier.
classifiers = ["Private :: Do Not Upload"]
