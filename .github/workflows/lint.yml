name: Lint

on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed Python files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Install nox
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox

      - name: Prepare noxfile
      # copy from customized noxfile so that we don't lint everything in the repository
      # we don't expect contributors to fix past lint issues
        run: cp .github/scripts/noxfile-lint.py noxfile.py

      - name: Make script executable
        run: chmod +x .github/scripts/lint-changed.sh

      - name: Run lint script for changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          .github/scripts/lint-changed.sh "pull_request" "$BASE_REF"
