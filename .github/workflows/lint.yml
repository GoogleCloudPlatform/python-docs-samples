name: Lint

on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed Python files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install nox
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox

      - name: Prepare noxfile
      # copy from customized noxfile so that we don't lint everything in the repository
      # we don't expect contributors to fix past lint issues
        run: cp .github/scripts/noxfile-lint.py noxfile.py

      - name: Make script executable
        run: chmod +x .github/scripts/lint-changed.sh

      - name: Run lint script for changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          .github/scripts/lint-changed.sh "pull_request" "$BASE_REF"
